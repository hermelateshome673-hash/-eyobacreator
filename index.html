 
<script>
document.addEventListener("DOMContentLoaded", function () {
  const form = document.querySelector("#eyoba-register form");
  const message = document.querySelector("#eyoba-register-message");

  if (!form) {
    console.error("Registration form not found.");
    return;
  }

  form.addEventListener("submit", function (event) {
    event.preventDefault();

    const email = form.querySelector('input[type="email"]');
    const passwords = form.querySelectorAll('input[type="password"]');

    if (!email || passwords.length < 2) {
      alert("Please check the registration form fields.");
      return;
    }

    if (!email.checkValidity()) {
      email.reportValidity();
      return;
    }

    if (passwords[0].value.length < 8) {
      alert("Your new password must have at least 8 characters.");
      return;
    }

    if (passwords[0].value !== passwords[1].value) {
      alert("The passwords do not match. Please try again.");
      return;
    }

    if (message) {
      message.textContent =
        "Your form is working! Real account creation is not connected yet.";
    } else {
      alert("Your form is working! Real account creation is not connected yet.");
    }
  });
});
</script>
