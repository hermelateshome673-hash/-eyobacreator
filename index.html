 <!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#071126">
<title>Eyoba Universe ✦</title>
<style>
:root {
  --bg:#050b19;
  --panel:rgba(15,29,58,.88);
  --panel2:#122345;
  --text:#f4f7ff;
  --muted:#aab9d7;
  --cyan:#5df3ff;
  --blue:#58a6ff;
  --purple:#a68bff;
  --line:#7bb8ff33;
}
* { box-sizing:border-box; }
html { scroll-behavior:smooth; scroll-padding-top:85px; }
body {
  margin:0;
  background:radial-gradient(ellipse at 15% 5%,#173e7638,transparent 35%),
  radial-gradient(ellipse at 85% 35%,#652ba52b,transparent 35%),var(--bg);
  color:var(--text);
  font:16px/1.65 system-ui,Segoe UI,sans-serif;
}
body.light {
  --bg:#edf4ff;
  --panel:#ffffffdf;
  --panel2:#e1ecff;
  --text:#152442;
  --muted:#526787;
  --line:#4673ad33;
}
a { color:inherit; text-decoration:none; }
button,input,textarea { font:inherit; }
button { cursor:pointer; }
.container { width:min(1180px,92%); margin:auto; }
header {
  position:sticky; top:0; z-index:10;
  background:var(--bg);
  border-bottom:1px solid var(--line);
}
.nav {
  display:flex; align-items:center; justify-content:space-between;
  gap:14px; min-height:72px;
}
.brand { font-weight:950; }
.brand span,.cyan { color:var(--cyan); }
.links { display:flex; gap:16px; flex-wrap:wrap; }
.links a { color:var(--muted); font-size:.9rem; }
.links a:hover { color:var(--cyan); }
.nav button,.btn,.smallbtn {
  border:1px solid var(--line);
  border-radius:12px; padding:10px 14px;
  background:var(--panel); color:var(--text);
}
.btn {
  display:inline-flex; align-items:center; justify-content:center;
  gap:8px;
  background:linear-gradient(110deg,var(--cyan),var(--blue));
  color:#071326; font-weight:850; border:0;
}
.btn.alt {
  background:var(--panel);
  border:1px solid var(--line);
  color:var(--text);
}
.menu { display:none; }
.hero { padding:72px 0 45px; }
.heroGrid {
  display:grid; grid-template-columns:1.1fr .9fr;
  align-items:center; gap:35px;
}
.eyebrow,.tag {
  display:inline-block; border:1px solid var(--line);
  border-radius:30px; padding:5px 11px;
  color:var(--cyan); background:var(--panel);
  font-size:.78rem; font-weight:800;
}
h1 {
  font-size:clamp(2.8rem,6vw,5.5rem);
  line-height:1.03; letter-spacing:-3px; margin:20px 0;
}
.gradient {
  background:linear-gradient(100deg,#5df3ff,#74a8ff,#c0a2ff);
  background-clip:text; color:transparent;
}
.lead { font-size:1.08rem; color:var(--muted); max-width:640px; }
.actions { display:flex; gap:12px; flex-wrap:wrap; margin:24px 0; }
.miniStats { display:flex; gap:24px; flex-wrap:wrap; }
.miniStats strong { display:block; font-size:1.2rem; }
.miniStats span { color:var(--muted); font-size:.82rem; }
.spaceArt { min-height:390px; display:grid; place-items:center; position:relative; }
.planet {
  width:205px; height:205px; border-radius:50%;
  background:radial-gradient(circle at 30% 25%,#b6ffff,#308ce9 35%,#252d8b 68%,#080c29);
  box-shadow:0 0 55px #3c9bff66,inset -25px -20px 35px #02051b;
  position:relative;
}
.planet:after {
  content:""; position:absolute; left:-40px; top:76px;
  width:280px; height:55px;
  border:13px solid #a3eaff65;
  border-left-color:transparent; border-right-color:transparent;
  border-radius:50%; transform:rotate(-24deg);
}
.orbit {
  position:absolute; width:365px; height:365px;
  border:1px solid #5df3ff4a; border-radius:50%;
  animation:spin 36s linear infinite;
}
.orbit.two {
  width:295px; height:295px; border-color:#aa8dff66;
  animation-direction:reverse; animation-duration:23s;
}
.orbDot {
  position:absolute; top:40px; left:70px;
  width:17px; height:17px; border-radius:50%;
  background:var(--cyan); box-shadow:0 0 20px var(--cyan);
}
.float {
  position:absolute; background:var(--panel);
  border:1px solid var(--line); padding:12px 15px;
  border-radius:15px; box-shadow:0 14px 40px #0003;
}
.float.one { right:0; top:35px; }
.float.two { left:0; bottom:30px; }
@keyframes spin { to { transform:rotate(360deg); } }
section { padding:54px 0; }
.sectionHead {
  display:flex; align-items:end; justify-content:space-between;
  gap:18px; margin-bottom:24px;
}
.sectionHead h2 {
  font-size:clamp(1.8rem,4vw,2.7rem);
  line-height:1.15; margin:5px 0;
}
.sectionHead p { color:var(--muted); margin:0; }
.kicker { font-size:.75rem; letter-spacing:2px; color:var(--cyan); font-weight:900; }
.grid { display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); gap:17px; }
.card {
  min-width:0; background:var(--panel);
  border:1px solid var(--line); border-radius:22px;
  padding:22px; box-shadow:0 18px 48px #0002;
  transition:transform .2s,border-color .2s;
}
.card:hover { transform:translateY(-3px); border-color:#5df3ff70; }
.card h3 { margin:9px 0 5px; }
.card p { color:var(--muted); margin:8px 0 15px; }
.ico {
  width:52px; height:52px; display:grid; place-items:center;
  border-radius:16px; background:linear-gradient(135deg,#2c6fd344,#9a7bff32);
  border:1px solid var(--line); font-size:1.6rem;
}
.profileGrid { display:grid; grid-template-columns:.8fr 1.2fr; gap:18px; }
.profile { text-align:center; }
.portrait {
  width:190px; height:190px; object-fit:cover;
  object-position:center; border-radius:50%;
  border:4px solid var(--cyan);
  box-shadow:0 0 0 9px #58a6ff1c,0 0 38px #58a6ff44;
  background:var(--panel2);
}
.level { font-size:2.3rem; font-weight:950; color:var(--cyan); }
.track {
  height:10px; border-radius:20px; background:var(--panel2);
  overflow:hidden; border:1px solid var(--line);
}
.fill {
  height:100%; width:0;
  background:linear-gradient(90deg,var(--blue),var(--cyan),var(--purple));
  transition:width .3s;
}
.stats { display:grid; grid-template-columns:repeat(2,1fr); gap:12px; }
.stat { background:var(--panel2); border:1px solid var(--line); border-radius:16px; padding:16px; }
.stat span { display:block; color:var(--muted); font-size:.82rem; }
.stat strong { font-size:1.5rem; }
.mission {
  display:flex; align-items:center; gap:12px;
  padding:12px 0; border-bottom:1px solid var(--line);
}
.mission:last-child { border:0; }
.missionInfo { flex:1; }
.missionInfo small { display:block; color:var(--muted); }
.smallbtn:disabled { opacity:.45; cursor:default; }

<section class="container" id="ethiopia">
  <div class="sectionHead">
    <div>
      <div class="kicker">DISCOVER YOUR HOME</div>
      <h2>🇪🇹 Ethiopia Explorer</h2>
      <p>Explore amazing places and earn cosmic rewards.</p>
    </div>
  </div>
  <div class="grid">
    <div class="card">

      <button class="btn explore" data-name="Simien Mountains">Explore +25 XP</button>
    </div>
    <div class="card">
      <div class="destination">🌲</div>
      <h3>Bale Mountains</h3>
      <p>Discover highland forests, wildlife, and peaceful landscapes.</p>
      <button class="btn explore" data-name="Bale Mountains">Explore +25 XP</button>
    </div>
    <div class="card">
      <div class="destination">💧</div>
      <h3>Blue Nile Falls</h3>
      <p>Discover the spectacular waterfall known as Tis Abay.</p>
      <button class="btn explore" data-name="Blue Nile Falls">Explore +25 XP</button>
    </div>
    <div class="card">
      <div class="destination">⛪</div>
      <h3>Lalibela</h3>
      <p>Explore the famous rock-hewn churches and historic heritage.</p>
      <button class="btn explore" data-name="Lalibela">Explore +25 XP</button>
    </div>
    <div class="card">
      <div class="destination">🌊</div>
      <h3>Lake Tana</h3>
      <p>Imagine peaceful waters, islands, and historic monasteries.</p>
      <button class="btn explore" data-name="Lake Tana">Explore +25 XP</button>
    </div>
    <div class="card">
      <div class="destination">🏰</div>
      <h3>Gondar</h3>
      <p>Discover the historic castles and royal architecture of Ethiopia.</p>
      <button class="btn explore" data-name="Gondar">Explore +25 XP</button>
    </div>
  </div>
</section>

<section class="container" id="nova">
  <div class="sectionHead">
    <div>
      <div class="kicker">YOUR COSMIC COMPANION</div>
      <h2>🤖 Meet Nova</h2>
      <p>Chat with Nova for jokes, inspiration, and destination ideas.</p>
    </div>
  </div>
  <div class="card">
    <div class="chatbox" id="chat">Nova: Hello, cosmic explorer! Welcome to Eyoba Universe. 🌌</div>
    <div class="chatrow">
      <input id="message" type="text" placeholder="Say hello or ask for a joke..." aria-label="Message to Nova">
      <button class="btn" id="send">Send</button>
    </div>
    <div class="actions">
      <button class="smallbtn quick" data-msg="joke">😂 Tell me a joke</button>
      <button class="smallbtn quick" data-msg="place">🗺️ Suggest a place</button>
      <button class="smallbtn quick" data-msg="motivate">✨ Motivate me</button>
    </div>
    <p class="notice">Nova is a built-in demo companion. It does not connect to an online AI service.</p>
  </div>
</section>

<section class="container" id="quiz">
  <div class="sectionHead">
    <div>
      <div class="kicker">TEST YOUR KNOWLEDGE</div>
      <h2>🧠 Universe Quiz</h2>
      <p>Answer correctly to earn cosmic rewards.</p>
    </div>
  </div>
  <div class="card">
    <h3>Which Ethiopian town is famous for its rock-hewn churches?</h3>
    <div class="actions">
      <button class="smallbtn answer" data-correct="false">Gondar</button>
      <button class="smallbtn answer" data-correct="true">Lalibela</button>
      <button class="smallbtn answer" data-correct="false">Bale Mountains</button>
    </div>
    <p id="quizResult" aria-live="polite"></p>
  </div>
</section>

<script>
(function () {
  let xp = 0;
  let coins = 0;
  let bonus = false;
  let done = {};
  let quizDone = false;

  try {
    const saved = JSON.parse(localStorage.getItem("eyobaUniverseSave") || "null");
    if (saved) {
      xp = saved.xp || 0;
      coins = saved.coins || 0;
      bonus = !!saved.bonus;
      done = saved.done || {};
      quizDone = !!saved.quizDone;
    }

    if (localStorage.getItem("eyobaUniverseTheme") === "light") {
      document.body.classList.add("light");
    }
  } catch (e) {}

  function level() {
    return Math.floor(xp / 100) + 1;
  }

  function rank() {
    if (level() >= 10) return "Universe Legend";
    if (level() >= 5) return "Cosmic Explorer";
    if (level() >= 3) return "Star Navigator";
    return "Curious Explorer";
  }

  function save() {
    try {
      localStorage.setItem("eyobaUniverseSave", JSON.stringify({
        xp: xp,
        coins: coins,
        bonus: bonus,
        done: done,
        quizDone: quizDone
      }));
    } catch (e) {}
  }

  function render() {
    document.getElementById("xp").textContent = xp;
    document.getElementById("xpTop").textContent = xp;
    document.getElementById("coinsTop").textContent = coins;
    document.getElementById("levelTop").textContent = level();
    document.getElementById("level").textContent = "Level " + level();
    document.getElementById("rank").textContent = rank();

    document.getElementById("bar").style.width = (xp % 100) + "%";
    document.getElementById("next").textContent = 100 - (xp % 100);

    document.getElementById("bonus").disabled = bonus;

    document.querySelectorAll(".explore").forEach(function (button) {
      if (done[button.dataset.name]) {
        button.disabled = true;
        button
